name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Required permissions for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent multiple deployments from running at the same time
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Vite Application
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build Vite application
      - name: Build application
        run: npm run build

      # 5. Verify production build
      - name: Verify build output
        run: |
          echo "===== dist directory ====="
          find dist -maxdepth 2 -type f | sort

          echo ""
          echo "===== dist/index.html ====="
          cat dist/index.html

          echo ""
          echo "===== Check for source main.jsx ====="

          if grep -q "/src/main.jsx" dist/index.html; then
            echo "ERROR: dist/index.html still references /src/main.jsx"
            exit 1
          else
            echo "OK: Vite production bundle detected"
          fi

      # 6. Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 7. Upload ONLY dist/
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4